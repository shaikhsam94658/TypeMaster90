@@OS: Processes and Threads|Type to learn. Read each sentence, understand it, then type it. By the end you will remember these OS basics.|p|250|0.92
An operating system is system software that manages hardware resources and provides services to application programs. The kernel is the core of the operating system and runs in privileged kernel mode, while user programs run in user mode. A program becomes a process when it is loaded into memory and given a process control block, which stores its state, program counter, registers, and open files.
A process moves through states such as new, ready, running, waiting, and terminated. A context switch saves the state of the running process and loads the state of another, which costs time but gives the illusion of parallelism. A thread is a lightweight unit of execution inside a process; threads share the code, data, and heap, but each thread has its own stack and registers.
System calls are the controlled doorway from user mode into the kernel, for example fork, exec, read, write, and exit. The fork call creates a child process as a copy of the parent, and exec replaces the process image with a new program. A zombie process has finished but still has an entry in the process table until its parent calls wait, and an orphan process is one whose parent has exited.
Inter-process communication lets processes exchange data using pipes, message queues, shared memory, and sockets. Shared memory is the fastest method because no copy through the kernel is needed, but it requires synchronization. A race condition occurs when the result depends on the order of execution, and a critical section is the code that must run by only one thread at a time.
Q>What do threads share, and what is private to each thread?|They share code, data and heap; each has its own stack and registers.
Q>What does fork() do?|Creates a child process as a copy of the parent.
Q>What is a zombie process?|A finished process still in the process table until the parent calls wait().
Q>Fastest IPC method?|Shared memory (but it needs synchronization).
Q>What is a race condition?|The result depends on the order in which threads or processes run.
@@OS: Scheduling, Deadlock, Memory|The most asked OS interview topics. Type slowly and clean, then repeat for speed.|p|250|0.92
CPU scheduling decides which ready process runs next. First Come First Served is simple but suffers from the convoy effect. Shortest Job First minimizes average waiting time but can starve long jobs. Round Robin gives each process a fixed time quantum, which makes it fair and suitable for time sharing systems, and priority scheduling uses aging to prevent starvation.
Synchronization tools include mutexes, semaphores, and monitors. A semaphore is an integer variable accessed only through wait and signal operations, and a binary semaphore behaves like a lock. The classic problems are the producer consumer, readers writers, and dining philosophers, and they teach how to avoid race conditions without causing deadlock.
A deadlock happens when processes wait for each other forever. It needs four conditions together: mutual exclusion, hold and wait, no preemption, and circular wait. We can prevent it by breaking one condition, avoid it with the Banker's algorithm, detect it using a resource allocation graph, or simply ignore it like most general purpose systems do.
Virtual memory lets a process use more memory than is physically installed by keeping only needed pages in RAM. The memory management unit translates virtual addresses to physical addresses using page tables, and the translation lookaside buffer caches recent translations. A page fault occurs when a page is not in RAM, and replacement algorithms like FIFO, LRU, and Optimal choose which page to evict. Thrashing happens when the system spends more time swapping pages than executing.
Q>Four necessary conditions for deadlock?|Mutual exclusion, hold and wait, no preemption, circular wait.
Q>Which scheduler uses a time quantum?|Round Robin.
Q>What caches virtual to physical address translations?|The TLB (translation lookaside buffer).
Q>What is thrashing?|The system spends more time swapping pages than executing.
Q>Which algorithm is used for deadlock avoidance?|The Banker's algorithm.
@@Computer Networks|Layers, protocols, ports and HTTP. Core knowledge for every backend and full stack developer.|p|250|0.92
The OSI model has seven layers: physical, data link, network, transport, session, presentation, and application. The TCP/IP model simplifies this into four layers. Each layer adds its own header to the data as it moves down, which is called encapsulation, and the receiver removes the headers in reverse order.
IP addresses identify hosts on a network, and IPv4 uses 32 bits while IPv6 uses 128 bits. Routers forward packets between networks using routing tables, and the subnet mask separates the network part from the host part. DNS translates human readable domain names like example.com into IP addresses, and DHCP assigns addresses automatically.
TCP is a reliable, connection oriented protocol that uses a three way handshake of SYN, SYN-ACK, and ACK, along with sequence numbers, acknowledgements, and congestion control. UDP is connectionless and faster but offers no delivery guarantee, so it is used for streaming, gaming, and DNS queries. Ports identify the application, for example HTTP uses 80, HTTPS uses 443, SSH uses 22, and DNS uses 53.
HTTP is a stateless request response protocol where the client sends a method such as GET, POST, PUT, or DELETE and the server replies with a status code like 200, 301, 404, or 500. HTTPS adds TLS encryption using certificates and public key cryptography to protect data in transit. Cookies, sessions, and tokens such as JWT are used to remember users across requests.
Q>OSI layers in order?|Physical, Data link, Network, Transport, Session, Presentation, Application.
Q>TCP three way handshake?|SYN, SYN-ACK, ACK.
Q>Default ports of HTTP, HTTPS, SSH, DNS?|80, 443, 22, 53.
Q>IPv4 vs IPv6 address size?|32 bits vs 128 bits.
@@DBMS and Databases|Keys, normalization, ACID and indexes. Interview favourites that you will now type and remember.|p|250|0.92
A database management system stores data and provides safe, fast access to it. The relational model organizes data into tables with rows and columns, and a primary key uniquely identifies every row. A foreign key links one table to another and enforces referential integrity.
Normalization reduces redundancy and update anomalies. First normal form removes repeating groups, second normal form removes partial dependencies, and third normal form removes transitive dependencies. Sometimes databases are denormalized on purpose to make reads faster.
A transaction is a group of operations that must follow the ACID properties: atomicity means all or nothing, consistency means valid state to valid state, isolation means transactions do not interfere, and durability means committed data survives crashes. Locks and isolation levels prevent problems such as dirty reads, non repeatable reads, and phantom reads.
An index, usually a B plus tree, speeds up searches from linear time to logarithmic time but slows down writes and uses extra space. NoSQL databases such as MongoDB, Redis, and Cassandra trade strict structure for scalability, and the CAP theorem says a distributed system cannot guarantee consistency, availability, and partition tolerance all at once.
Q>What does ACID stand for?|Atomicity, Consistency, Isolation, Durability.
Q>What does third normal form remove?|Transitive dependencies.
Q>Which structure do most indexes use?|A B+ tree, giving O(log n) search.
Q>What does the CAP theorem say?|A distributed system cannot guarantee Consistency, Availability and Partition tolerance all together.
@@DSA and Complexity|Big O, core data structures and classic algorithms. Faster typing and a sharper interview brain at the same time.|p|250|0.92
An algorithm is a finite sequence of steps that solves a problem, and Big O notation describes how its running time or memory grows with the input size. Constant time is O(1), binary search is O(log n), a single loop is O(n), good sorting algorithms such as merge sort and quick sort run in O(n log n), and nested loops give O(n squared).
An array gives constant time access by index but slow insertion in the middle, while a linked list allows fast insertion but needs linear time to reach an element. A stack follows last in first out and is used for function calls and undo, and a queue follows first in first out and is used for scheduling and breadth first search.
A hash table maps keys to buckets using a hash function and gives average constant time lookup, but collisions must be handled with chaining or open addressing. A binary search tree keeps smaller values on the left and larger values on the right, and balanced versions like AVL and red black trees guarantee logarithmic height. A heap is a complete binary tree used to build priority queues.
Graphs are traversed using breadth first search with a queue or depth first search with a stack or recursion. Dijkstra's algorithm finds the shortest path with non negative weights, and dynamic programming solves overlapping subproblems by storing results, which turns exponential recursion into polynomial time. Greedy algorithms make the best local choice, and backtracking explores all possibilities and undoes bad choices.
Q>Complexity of binary search?|O(log n).
Q>Stack vs queue?|Stack is LIFO, queue is FIFO.
Q>Which data structure does BFS use?|A queue.
Q>What does dynamic programming store?|Results of overlapping subproblems.
@@OOP and Clean Code|Pillars, SOLID, patterns and engineering habits. Type like an engineer who writes clean code.|p|250|0.92
Object oriented programming organizes software into objects that combine data and behavior. The four pillars are encapsulation, abstraction, inheritance, and polymorphism. Encapsulation hides internal state behind methods, abstraction exposes only what is necessary, inheritance lets a class reuse another class, and polymorphism lets the same call behave differently depending on the object.
The SOLID principles guide clean design: single responsibility, open closed, Liskov substitution, interface segregation, and dependency inversion. Prefer composition over inheritance, keep functions small, and follow DRY, which means do not repeat yourself, and KISS, which means keep it simple.
Design patterns are reusable solutions to common problems. The singleton ensures a single instance, the factory creates objects without exposing the construction logic, the observer notifies many listeners when state changes, and the strategy swaps algorithms at runtime. MVC separates the model, the view, and the controller.
Good engineers write tests, use version control, review code, and measure performance before optimizing. Premature optimization is the root of all evil, so first make it work, then make it right, then make it fast. Debugging is about forming a hypothesis, reproducing the bug, and changing one thing at a time.
Q>Four pillars of OOP?|Encapsulation, abstraction, inheritance, polymorphism.
Q>What do the SOLID letters stand for?|Single responsibility, Open/closed, Liskov substitution, Interface segregation, Dependency inversion.
Q>Purpose of the observer pattern?|Notify many listeners when state changes.
Q>What does DRY mean?|Do not repeat yourself.

A compiler translates source code into machine code in phases: lexical analysis, parsing, semantic analysis, optimization, and code generation. An interpreter executes code line by line, and JavaScript engines like V8 use just in time compilation to get the best of both. Memory in a program is split into the stack for function calls and local variables, and the heap for dynamically allocated objects; a memory leak happens when heap memory is never released.
Version control with Git stores snapshots of a project as commits connected in a graph. A branch is just a movable pointer to a commit, merging combines histories, and rebasing replays commits on top of another base. Continuous integration runs tests automatically on every push, and continuous deployment ships passing builds to production.
Security begins with hashing passwords using a slow salted algorithm such as bcrypt, never storing them in plain text. Common attacks include SQL injection, cross site scripting, and cross site request forgery, and they are prevented with parameterized queries, output escaping, and anti forgery tokens. Symmetric encryption like AES uses one shared key, while asymmetric encryption like RSA uses a public and private key pair.
Modern web applications run in the browser using the event loop. JavaScript is single threaded, so long tasks block the page, and asynchronous callbacks, promises, and async await keep the interface responsive. The call stack runs synchronous code, the microtask queue runs promise callbacks first, and then the task queue runs timers and events.
Q>Where do local variables live?|On the stack.
Q>What is a memory leak?|Heap memory that is never released.
Q>How do you prevent SQL injection?|Parameterized queries.
Q>Which runs first, microtasks or timers?|Microtasks (promise callbacks).
@@FINAL EXAM: 90 WPM|Code and theory mixed. Hit your target with 95 percent accuracy and you are a typing master. Stay calm and smooth.|p|900|1
In JavaScript, const user = { name: 'Dev', id: 42 }; creates an object, and user.name returns the string. When the browser runs your script, the call stack executes functions one by one, and an async function such as await fetch('/api/data') hands control back to the event loop until the network replies.
In Linux, ps aux | grep node lists processes, and kill -9 1234 sends SIGKILL, which the kernel delivers without letting the process clean up. Each process has a PID, its own virtual address space, and a page table; when you call fork(), the child gets a copy-on-write view of the parent's memory.
A SQL query like SELECT * FROM orders WHERE total > 500 ORDER BY id DESC LIMIT 10; is parsed, optimized, and executed by the database engine. With an index on total, the engine uses a B+ tree lookup in O(log n) instead of scanning every row, and a transaction wraps writes so that COMMIT makes them durable while ROLLBACK undoes them.
On the network, a request to https://example.com:443/api?id=7 first resolves DNS, opens a TCP connection with SYN, SYN-ACK, ACK, negotiates TLS, and then sends GET /api HTTP/1.1. The server returns 200 OK with JSON like {"ok": true, "items": [1, 2, 3]}, and your code reads it with res.json().
Q>What does kill -9 send?|SIGKILL.
Q>Why is an indexed lookup fast?|A B+ tree gives O(log n) search.
Q>What does COMMIT do?|Makes the transaction changes durable.

  <div class="sp"></div><div class="bar"><i style="width:${dn/30*100}%"></i></div><p class="mut" style="margin-top:6px;font-size:13px">${dn}/30 chapters done &middot; last 5 runs avg ${avg5?avg5.toFixed(0):'--'} WPM &middot; streak ${streak()} day(s)</p></div>
  <div class="sp"></div><div class="sp"></div>
  <div class="grid g4">
    <div class="card"><b>\u25B6 Continue</b><p class="mut" style="font-size:13px;margin:6px 0 10px">${cur?'Ch '+cur.id+': '+esc(cur.title):'All done!'}</p><button class="btn pri" ${cur?'':'disabled'} onclick="startCh(${cur?cur.id:1})">Start</button></div>
    <div class="card"><b>\uD83D\uDD01 Daily Review</b><p class="mut" style="font-size:13px;margin:6px 0 10px">${due.length?due.length+' chapter(s) due - bhoolne se pehle revise':'Kuch due nahi'}</p><button class="btn pri" ${due.length?'':'disabled'} onclick="startReview()">Review</button></div>
    <div class="card"><b>\uD83C\uDFAF Weak Keys Drill</b><p class="mut" style="font-size:13px;margin:6px 0 10px">${wk.length?wk.map(w=>'<span class="chip">'+esc(nm(w.k))+'</span>').join(''):'Pehle kuch runs kar'}</p><button class="btn pri" ${wk.length?'':'disabled'} onclick="startWeak()">Fix them</button></div>
    <div class="card"><b>\uD83C\uDFB2 Random Mix</b><p class="mut" style="font-size:13px;margin:6px 0 10px">Unlocked chapters ka random drill. Infinite practice.</p><button class="btn pri" onclick="startFree()">Go</button></div>
  </div>
  <div class="sp"></div><div class="sp"></div>
  <div class="grid g2">
    <div class="card"><b>\uD83D\uDCC5 Daily 90 minute routine</b><ul class="rt mut"><li>5 min: Daily Review (warm-up)</li><li>40 min: aaj ke 2 chapters (passes complete kar)</li><li>20 min: Weak Keys Drill</li><li>25 min: Random Mix ya purane chapters speed pe</li></ul>
    <div class="sp"></div><div class="bar"><i style="width:${Math.min(100,mt/90*100)}%"></i></div><p class="mut" style="font-size:13px;margin-top:6px">Aaj: ${mt.toFixed(0)} / 90 min</p></div>
    <div class="card"><b>\uD83D\uDCC8 Recent WPM</b><canvas id="hc"></canvas></div>
  </div>
  <div class="sp"></div><div class="card"><b>\uD83D\uDCA1 Tip of the day</b><p class="mut" style="margin-top:4px">${TIPS[dy%TIPS.length]}</p></div>`;
  chart($('#hc'),S.hist.slice(-30).map(h=>h.wpm),{lines:[{y:90,c:'#fbbf24',t:'90 goal'}]})}

/* ---------- CHAPTERS ---------- */
function chCard(c){const r=getRec(c.id),ok=unlocked(c),d=isDone(c),due=r.box>=0&&r.due&&r.due<=dk();
  const kinds={d:'drill',c:'code',p:'CS paragraphs'};
  return `<div class="card chap ${ok?'':'lock'} ${d?'done':''}" ${ok?`onclick="startCh(${c.id})"`:''}><div class="row"><span class="badge">Ch ${c.id}</span><span>${d?'\u2705':ok?'\u25B6':'\uD83D\uDD12'}${due?' <span class="badge warn">review due</span>':''}</span></div>
  <h3>${esc(c.title)}</h3><p>${esc(c.tip)}</p><div class="sp"></div>
  <div class="row" style="align-items:center"><span>${Array.from({length:c.need},(_,i)=>`<i class="dot ${i<r.passes?'on':''}"></i>`).join('')}</span><span class="mut" style="font-size:12px">${kinds[c.kind]} &middot; target ${tgt(c)} WPM &middot; best ${r.best?r.best.toFixed(0):'--'}</span></div></div>`}
function renderChapters(){let h='<h2>30 Chapters &middot; 15 Days</h2><p class="mut">Har chapter me target WPM aur 95% accuracy ke saath utne passes chahiye jitne dots hain. Phir agla chapter unlock hota hai.</p>';
  for(let d=1;d<=15;d++){const cs=CH.filter(c=>c.day===d),dn=cs.every(isDone);h+=`<div class="day"><div class="dh"><b>Day ${d}</b> ${dn?'<span class="badge ok">complete</span>':d===dayNum()?'<span class="badge warn">today</span>':''}</div><div class="grid g2">${cs.map(chCard).join('')}</div></div>`}
  app.innerHTML=h}

/* ---------- RUN START ---------- */
function startCh(id){const c=CH[id-1];if(!unlocked(c))return;begin(c,'ch',genChapter(c))}
function startReview(){const d=dueList();if(!d.length)return;begin(d[0],'rev',genChapter(d[0]))}
function startWeak(){const g=genWeak();if(!g){alert('Pehle thode chapters kar, phir weak keys ka data banega.');return}begin(WK,'weak',g)}
function startFree(){const f=genFree();begin(f.c,'free',f.g)}
function begin(c,mode,g){stopTimer();closeModal();
  const goal=mode==='ch'?tgt(c):mode==='rev'?Math.round(tgt(c)*.9):90;
  R={c,mode,text:g.text,used:g.used||0,pos:0,st:null,last:0,strokes:0,wrong:0,okc:0,st8:new Array(g.text.length).fill(0),kd:{},cf:{},cT:[],done:false,goal,fin:0};
  view='type';render()}
function again(nw){const m=R.mode,c=R.c;let g;
  if(nw){if(m==='ch'||m==='rev'){if(!R.done&&c.kind==='p'){const r=S.ch[c.id]||(S.ch[c.id]=getRec(c.id));r.cur=(r.cur||0)+R.used}g=genChapter(c)}
    else if(m==='weak')g=genWeak()||{text:R.text,used:0};
    else{const f=genFree();begin(f.c,'free',f.g);return}}
  else g={text:R.text,used:R.used};
  begin(c,m,g)}

/* ---------- TYPING VIEW ---------- */
function renderType(){const c=R.c,m=R.mode;
  const lab=m==='ch'?'Day '+c.day+' &middot; Chapter '+c.id:m==='rev'?'Review &middot; Chapter '+c.id:m==='weak'?'Weak Keys Drill':'Random Mix &middot; Ch '+c.id;
  app.innerHTML=`<div class="row"><div><span class="badge">${lab}</span><h2>${m==='weak'?'Weak keys fix':esc(c.title)}</h2><p class="mut">${m==='weak'?'Teri sabse kamzor keys ke words. Slow aur clean type kar.':esc(c.tip)}</p></div><button class="btn" onclick="go('chapters')">\u2715 Exit</button></div>
  <div class="sp"></div><div class="grid g4"><div class="card stat"><div class="v" id="lw">0</div><div class="l">WPM</div></div><div class="card stat"><div class="v" id="la">100%</div><div class="l">Accuracy</div></div><div class="card stat"><div class="v" id="lt">0:00</div><div class="l">Time</div></div><div class="card stat"><div class="v">${R.goal}</div><div class="l">${m==='ch'||m==='rev'?'Target WPM':'Goal WPM'}</div></div></div>
  <div class="sp"></div><div class="bar"><i id="prog"></i></div><div class="sp"></div>
  <div class="typebox" id="tb"></div><div class="warnbox" id="caps"></div>
  ${S.set.kb?'<div class="kb" id="kb">'+kbHTML()+'</div>':''}
  <p class="mut" style="text-align:center;font-size:13px">Timer pehli key se start. <b>Esc</b> = same text restart &middot; <b>Tab</b> = new text &middot; Backspace allowed</p>`;
  const tb=$('#tb');let h='';for(const ch of R.text)h+=ch==='\n'?'<span class="ch nl">\u21B5</span><br>':'<span class="ch">'+esc(ch)+'</span>';
  tb.innerHTML=h;R.sp=$$('.ch',tb);R.km=S.set.kb?kbMap($('#kb')):{};paint(0);hlNext()}
function paint(i){const s=R.sp[i];if(!s)return;let c='ch';if(R.text[i]==='\n')c+=' nl';if(R.st8[i]===1)c+=' ok';else if(R.st8[i]===2)c+=' bad';if(i===R.pos)c+=' cur';s.className=c}
function hlNext(){Object.values(R.km).forEach(e=>e.classList.remove('next'));const ch=R.text[R.pos];if(ch==null)return;const b=baseOf(ch),e=R.km[b.k];if(e)e.classList.add('next');
  if(b.shift){const left=FG[b.k]!=null&&FG[b.k]<=3;const s=R.km[left?'shiftR':'shiftL'];if(s)s.classList.add('next')}}
function fmt(s){s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function updLive(){if(!R||!R.st)return;const el=(performance.now()-R.st)/1000;
  $('#lw').textContent=el>1?Math.round(R.okc/5/(el/60)):0;$('#la').textContent=(R.strokes?Math.round((R.strokes-R.wrong)/R.strokes*100):100)+'%';$('#lt').textContent=fmt(el)}

function onKey(e){
  if(modalOpen){if(e.key==='Enter'&&R&&Date.now()-R.fin>700){e.preventDefault();const b=$('#mp');if(b)b.click()}return}
  if(view!=='type'||!R)return;if(e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key;
  if(k==='Escape'){e.preventDefault();again(false);return}
  if(k==='Tab'){e.preventDefault();again(true);return}
  if(R.done)return;
  const cp=$('#caps');if(cp)cp.textContent=e.getModifierState&&e.getModifierState('CapsLock')?'\u26A0 CAPS LOCK ON':'';
  if(k==='Backspace'){e.preventDefault();if(R.pos>0){const o=R.pos;R.pos--;if(R.st8[R.pos]===1)R.okc--;R.st8[R.pos]=0;paint(o);paint(R.pos);hlNext()}return}
  let ch;if(k==='Enter')ch='\n';else if(k.length===1)ch=k;else return;
  e.preventDefault();
  const now=performance.now();if(!R.st){R.st=now;R.last=now;tmr=setInterval(updLive,200)}
  const exp=R.text[R.pos],ok=ch===exp,kd=R.kd[exp]||(R.kd[exp]={n:0,e:0,ms:0,c:0});kd.n++;
  if(ok){const d=now-R.last;if(R.pos>0&&d<2500){kd.ms+=d;kd.c++}R.st8[R.pos]=1;R.okc++;R.cT.push(now-R.st)}
  else{kd.e++;R.wrong++;R.st8[R.pos]=2;const cf=exp+'\u2192'+ch;R.cf[cf]=(R.cf[cf]||0)+1;const eb=R.km[baseOf(ch).k];if(eb){eb.classList.add('err');setTimeout(()=>eb.classList.remove('err'),160)}}
  R.last=now;R.strokes++;const o=R.pos;R.pos++;paint(o);paint(R.pos);
  $('#prog').style.width=R.pos/R.text.length*100+'%';
  const cs=R.sp[R.pos];if(cs){const tb=$('#tb');tb.scrollTop=Math.max(0,cs.offsetTop-tb.clientHeight/2)}
  hlNext();
  if(R.pos>=R.text.length)finish(now)}
window.addEventListener('keydown',onKey);

/* ---------- FINISH ---------- */
function finish(now){stopTimer();R.done=true;R.fin=Date.now();
  const dur=Math.max(.5,(now-R.st)/1000),okc=R.st8.filter(x=>x===1).length,wpm=okc/5/(dur/60),raw=R.text.length/5/(dur/60),acc=R.strokes?(R.strokes-R.wrong)/R.strokes*100:100,c=R.c;
  const b=[];R.cT.forEach(t=>{const s=Math.floor(t/1000);b[s]=(b[s]||0)+1});const arr=[];for(let i=0;i<Math.floor(dur);i++)arr.push((b[i]||0)*12);
  let cons=100;if(arr.length>=3){const m=arr.reduce((a,x)=>a+x,0)/arr.length;if(m>0){const sd=Math.sqrt(arr.reduce((a,x)=>a+(x-m)**2,0)/arr.length);cons=Math.max(0,Math.round(100-sd/m*100))}else cons=0}
  for(const k in R.kd){const a=R.kd[k],t=S.keys[k]||(S.keys[k]={n:0,e:0,ms:0,c:0});t.n+=a.n;t.e+=a.e;t.ms+=a.ms;t.c+=a.c}
  for(const k in R.cf)S.conf[k]=(S.conf[k]||0)+R.cf[k];
  let pass=null,justDone=false;
  if(R.mode==='ch'){pass=wpm>=R.goal&&acc>=95;const r=S.ch[c.id]||(S.ch[c.id]=getRec(c.id));r.runs++;r.best=Math.max(r.best,wpm);r.bestAcc=Math.max(r.bestAcc,acc);
    if(pass){r.passes++;if(r.passes===c.need){justDone=true;r.box=0;r.due=addDays(1)}}if(c.kind==='p')r.cur=(r.cur||0)+R.used}
  else if(R.mode==='rev'){pass=wpm>=R.goal&&acc>=94;const r=S.ch[c.id];r.runs++;if(pass){r.box=Math.min(r.box+1,6);r.due=addDays(INT[r.box])}else{r.box=0;r.due=addDays(1)}if(c.kind==='p')r.cur=(r.cur||0)+R.used}
  S.hist.push({t:Date.now(),c:c.id,m:R.mode,wpm:+wpm.toFixed(1),acc:+acc.toFixed(1),raw:+raw.toFixed(1),cons,dur:+dur.toFixed(1),n:R.text.length,p:pass});
  if(S.hist.length>3000)S.hist.shift();save();
  showResult({wpm,raw,acc,cons,dur,pass,justDone,arr})}
function showResult(r){const c=R.c,m=R.mode;
  const slow=Object.entries(R.kd).filter(([k,v])=>v.c>=2&&k!==' ').map(([k,v])=>[k,v.ms/v.c]).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const errs=Object.entries(R.kd).filter(([k,v])=>v.e>0).sort((a,b)=>b[1].e-a[1].e).slice(0,6);
  const nextC=m==='ch'&&isDone(c)&&CH[c.id]&&unlocked(CH[c.id])?CH[c.id]:null;
  let head;
  if(m==='ch'){const rec=getRec(c.id);head=r.pass?`<div class="pass y">\u2705 Passed (${Math.min(rec.passes,c.need)}/${c.need})${r.justDone?' - Chapter complete! \uD83C\uDF89':''}</div>`:`<div class="pass n">Abhi nahi - ${r.wpm<R.goal?'speed '+Math.ceil(R.goal)+' chahiye':''}${r.wpm<R.goal&&r.acc<95?' aur ':''}${r.acc<95?'accuracy 95% chahiye':''}</div>`}
  else if(m==='rev')head=r.pass?'<div class="pass y">\u2705 Review pass - next review door shift hua</div>':'<div class="pass n">Review fail - kal phir aayega</div>';
  else head='<div class="pass y">Practice run saved</div>';
  const qa=(m==='ch'||m==='rev')&&c.qa.length?`<div class="sp"></div><b>\uD83E\uDDE0 Recall check (click to reveal)</b>`+c.qa.map(q=>`<div class="qa" onclick="this.classList.toggle('open')">${esc(q[0])}<div class="a">${esc(q[1])}</div></div>`).join(''):'';
  $('#modal').innerHTML=`<div class="mbox">${head}<p class="mut" style="margin-bottom:10px">${m==='ch'||m==='rev'?'Target: '+R.goal+' WPM &amp; '+(m==='ch'?95:94)+'% accuracy':'Goal: 90 WPM'}</p>
  <div class="grid g4"><div class="card stat"><div class="v">${r.wpm.toFixed(0)}</div><div class="l">Net WPM</div></div><div class="card stat"><div class="v">${r.acc.toFixed(1)}%</div><div class="l">Accuracy</div></div><div class="card stat"><div class="v">${r.raw.toFixed(0)}</div><div class="l">Raw WPM</div></div><div class="card stat"><div class="v">${r.cons}%</div><div class="l">Consistency</div></div><div class="card stat"><div class="v">${fmt(r.dur)}</div><div class="l">Time</div></div><div class="card stat"><div class="v">${R.wrong}</div><div class="l">Mistakes</div></div></div>
  <div class="sp"></div>${r.arr.length>=3?'<b>Speed over time</b><canvas id="rc" style="height:110px"></canvas>':''}
  <div class="sp"></div><div class="grid g2"><div><b>\uD83D\uDC22 Slowest keys</b><div>${slow.length?slow.map(s=>`<span class="chip">${esc(nm(s[0]))} ${Math.round(s[1])}ms</span>`).join(''):'<span class="mut">-</span>'}</div></div><div><b>\u274C Error keys</b><div>${errs.length?errs.map(s=>`<span class="chip">${esc(nm(s[0]))} x${s[1].e}</span>`).join(''):'<span class="mut">Perfect!</span>'}</div></div></div>
  ${qa}<div class="sp"></div><div class="row" style="justify-content:flex-start">
  <button class="btn pri" id="mp" onclick="again(true)">New text \u23CE</button><button class="btn" onclick="again(false)">Retry same</button>${nextC?`<button class="btn" onclick="startCh(${nextC.id})">Next chapter \u25B6</button>`:''}<button class="btn" onclick="go('chapters')">Chapters</button><button class="btn" onclick="go('analysis')">Analysis</button></div></div>`;
  $('#modal').classList.remove('hidden');modalOpen=true;
  if(r.arr.length>=3)chart($('#rc'),r.arr,{lines:[{y:R.goal,c:'#fbbf24',t:'target'}]})}

/* ---------- ANALYSIS ---------- */
let hm='acc';
function agg(){const a={};for(const c in S.keys){const v=S.keys[c],k=baseOf(c).k;if(!k)continue;const t=a[k]||(a[k]={n:0,e:0,ms:0,c:0});t.n+=v.n;t.e+=v.e;t.ms+=v.ms;t.c+=v.c}return a}
function setHm(m){hm=m;renderAnalysis()}
function renderAnalysis(){const H=S.hist,last=H.slice(-10),av=(a,f)=>a.length?a.reduce((s,x)=>s+f(x),0)/a.length:0;
  const best=H.reduce((m,h)=>Math.max(m,h.wpm),0),totT=H.reduce((a,h)=>a+h.dur,0)/60,ks=Object.values(S.keys).reduce((a,v)=>a+v.n,0);
  const f5=H.slice(0,5),l5=H.slice(-5);let trend='Kam se kam 6 runs chahiye trend ke liye.';
  if(H.length>=6){const d=av(l5,h=>h.wpm)-av(f5,h=>h.wpm);trend=(d>=0?'+':'')+d.toFixed(1)+' WPM improvement (pehle 5 runs vs last 5 runs). '+(av(l5,h=>h.wpm)>=90?'Target hit!':'Target se '+(90-av(l5,h=>h.wpm)).toFixed(0)+' WPM door.')}
  const days={};H.forEach(h=>{const d=dk(new Date(h.t));(days[d]=days[d]||[]).push(h)});
  const rows=Object.keys(days).sort().reverse().slice(0,15).map(d=>{const a=days[d];return `<tr><td>${d}</td><td>${a.length}</td><td>${(a.reduce((s,h)=>s+h.dur,0)/60).toFixed(0)} min</td><td>${av(a,h=>h.wpm).toFixed(0)}</td><td>${Math.max(...a.map(h=>h.wpm)).toFixed(0)}</td><td>${av(a,h=>h.acc).toFixed(1)}%</td></tr>`}).join('');
  const G={};for(const c in S.keys){const g=grp(c),v=S.keys[c],t=G[g]||(G[g]={n:0,e:0,ms:0,c:0});t.n+=v.n;t.e+=v.e;t.ms+=v.ms;t.c+=v.c}
  const grows=Object.entries(G).sort((a,b)=>b[1].e/b[1].n-a[1].e/a[1].n).map(([g,v])=>`<tr><td>${esc(g)}</td><td>${v.n}</td><td>${(100-v.e/v.n*100).toFixed(1)}%</td><td>${v.c?Math.round(v.ms/v.c):'-'} ms</td></tr>`).join('');
  const wk=weakKeys().slice(0,10).map(w=>`<tr><td><span class="chip">${esc(nm(w.k))}</span></td><td>${w.n}</td><td>${(100-w.er*100).toFixed(1)}%</td><td>${Math.round(w.avg)} ms</td></tr>`).join('');
  const conf=Object.entries(S.conf).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([k,v])=>{const [e,t]=k.split('\u2192');return `<tr><td><span class="chip">${esc(nm(e))}</span> typed as <span class="chip">${esc(nm(t))}</span></td><td>${v}</td></tr>`}).join('');
  const prog=CH.map(c=>{const r=getRec(c.id);return `<tr><td>${c.id}</td><td>${esc(c.title)}</td><td>${tgt(c)}</td><td>${r.best?r.best.toFixed(0):'-'}</td><td>${r.bestAcc?r.bestAcc.toFixed(1)+'%':'-'}</td><td>${r.runs}</td><td>${isDone(c)?'\u2705':r.passes+'/'+c.need}</td><td>${r.box>=0?r.due:'-'}</td></tr>`}).join('');
  app.innerHTML=`<h2>Analysis</h2><p class="mut">${trend}</p><div class="sp"></div>
  <div class="grid g4"><div class="card stat"><div class="v">${best?best.toFixed(0):'--'}</div><div class="l">Best WPM</div></div><div class="card stat"><div class="v">${last.length?av(last,h=>h.wpm).toFixed(0):'--'}</div><div class="l">Avg WPM (last 10)</div></div><div class="card stat"><div class="v">${last.length?av(last,h=>h.acc).toFixed(1)+'%':'--'}</div><div class="l">Avg accuracy</div></div><div class="card stat"><div class="v">${totT.toFixed(0)}m</div><div class="l">Total practice</div></div><div class="card stat"><div class="v">${ks}</div><div class="l">Keystrokes</div></div><div class="card stat"><div class="v">${streak()}</div><div class="l">Day streak</div></div></div>
  <div class="sp"></div><div class="grid g2"><div class="card"><b>WPM per run</b><canvas id="c1"></canvas></div><div class="card"><b>Accuracy per run</b><canvas id="c2"></canvas></div></div>
  <div class="sp"></div><div class="card"><div class="row"><b>\u2328 Keyboard heatmap</b><span><button class="btn" onclick="setHm('acc')" ${hm==='acc'?'style="border-color:var(--acc)"':''}>Accuracy</button> <button class="btn" onclick="setHm('spd')" ${hm==='spd'?'style="border-color:var(--acc)"':''}>Speed</button></span></div><p class="mut" style="font-size:13px">Green = achha, red = weak, grey = data kam. Hover karke numbers dekh.</p><div class="kb" id="hk">${kbHTML()}</div></div>
  <div class="sp"></div><div class="grid g2"><div class="card"><b>\uD83C\uDFAF Weakest keys</b><table><tr><th>Key</th><th>Count</th><th>Accuracy</th><th>Avg speed</th></tr>${wk||'<tr><td colspan=4 class="mut">No data yet</td></tr>'}</table></div>
  <div class="card"><b>\uD83D\uDCCA Key groups</b><table><tr><th>Group</th><th>Count</th><th>Accuracy</th><th>Speed</th></tr>${grows||'<tr><td colspan=4 class="mut">No data yet</td></tr>'}</table></div></div>
  <div class="sp"></div><div class="grid g2"><div class="card"><b>\uD83D\uDE35 Top mistakes</b><table>${conf||'<tr><td class="mut">No data yet</td></tr>'}</table></div>
  <div class="card"><b>\uD83D\uDDD3 Daily log</b><table><tr><th>Date</th><th>Runs</th><th>Time</th><th>Avg</th><th>Best</th><th>Acc</th></tr>${rows||'<tr><td colspan=6 class="mut">No data yet</td></tr>'}</table></div></div>
  <div class="sp"></div><div class="card"><b>\uD83D\uDCDA Chapter progress and next review date</b><div style="overflow:auto"><table><tr><th>#</th><th>Chapter</th><th>Target</th><th>Best</th><th>Acc</th><th>Runs</th><th>Passes</th><th>Next review</th></tr>${prog}</table></div></div>`;
  const rr=H.slice(-60);chart($('#c1'),rr.map(h=>h.wpm),{lines:[{y:90,c:'#fbbf24',t:'90 goal'}]});chart($('#c2'),rr.map(h=>h.acc),{min:80,max:100,color:'#60a5fa',lines:[{y:95,c:'#fbbf24',t:'95 min'}]});
  const ag=agg(),km=kbMap($('#hk'));for(const k in km){const a=ag[k];if(!a||a.n<3)continue;let h;
    if(hm==='acc'){const acc=100-a.e/a.n*100;h=Math.max(0,Math.min(130,(acc-85)/15*130))}else{const ms=a.c?a.ms/a.c:300;h=Math.max(0,Math.min(130,130*(1-(ms-150)/350)))}
    km[k].style.background=`hsl(${h} 65% 36%)`;km[k].style.color='#fff';km[k].title=nm(k)+': '+(100-a.e/a.n*100).toFixed(1)+'% acc, '+(a.c?Math.round(a.ms/a.c):'-')+' ms ('+a.n+' keys)'}}

/* ---------- SETTINGS ---------- */
function renderSettings(){app.innerHTML=`<h2>Settings</h2><div class="sp"></div><div class="grid g2">
  <div class="card"><b>Mera abhi ka speed (WPM)</b><p class="mut" style="font-size:13px;margin:4px 0 8px">Chapter targets is hisaab se set hote hain: Ch 1 se shuru, Ch 30 pe hamesha 90 WPM.</p><input type="number" min="10" max="80" value="${S.set.base}" onchange="S.set.base=Math.max(10,Math.min(80,+this.value||30));save();render()"></div>
  <div class="card"><b>Options</b><p style="margin:8px 0"><label><input type="checkbox" ${S.set.kb?'checked':''} onchange="S.set.kb=this.checked;save()"> On-screen keyboard guide (finger colors)</label></p><p><label><input type="checkbox" ${S.set.unlock?'checked':''} onchange="S.set.unlock=this.checked;save()"> Saare chapters unlock karo</label></p></div>
  <div class="card"><b>Backup</b><p class="mut" style="font-size:13px;margin:4px 0 8px">Progress browser me save hoti hai. Backup lete reh taaki kabhi na jaye.</p><button class="btn" onclick="expData()">Export JSON</button> <label class="btn" style="display:inline-block">Import<input type="file" accept=".json" hidden onchange="impData(this)"></label></div>
  <div class="card"><b>Reset everything</b><p class="mut" style="font-size:13px;margin:4px 0 8px">Saari progress delete ho jayegi.</p><button class="btn" onclick="resetAll()">Reset</button></div></div>`}
function expData(){const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='typemaster90-backup-'+dk()+'.json';a.click()}
function impData(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.ch||!j.hist)throw 0;localStorage.setItem(KEY,JSON.stringify(j));S=load();alert('Import ho gaya!');go('home')}catch(e){alert('Invalid backup file')}};r.readAsText(f)}
function resetAll(){if(confirm('Sach me saari progress delete karni hai?')){try{localStorage.removeItem(KEY)}catch(e){}S=load();go('home')}}

save();go('home');
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
